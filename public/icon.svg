<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="triPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0f172a" />
      <path d="M0,0 L40,0 L0,40 Z" fill="#f8fafc" />
    </pattern>
    <pattern id="chevronPattern" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="14" fill="#0f172a" />
      <rect y="14" width="28" height="14" fill="#f8fafc" />
    </pattern>
  </defs>

  <rect width="512" height="512" fill="#4338ca" />

  <!-- ears (behind head), each with its own pattern -->
  <path d="M196,246 C150,190 118,120 130,66 C134,48 158,44 176,58 C214,88 232,160 228,234 Z"
    fill="url(#triPattern)" stroke="#dc2626" stroke-width="10" stroke-linejoin="round" />
  <path d="M316,246 C362,190 394,120 382,66 C378,48 354,44 336,58 C298,88 280,160 284,234 Z"
    fill="url(#chevronPattern)" stroke="#dc2626" stroke-width="10" stroke-linejoin="round" />

  <!-- head -->
  <circle cx="256" cy="300" r="132" fill="#e2e8f0" stroke="#64748b" stroke-width="6" />
  <path d="M256,180 v240" stroke="#94a3b8" stroke-width="4" opacity="0.6" />

  <!-- patches -->
  <rect x="122" y="268" width="46" height="20" rx="4" fill="#1e293b" transform="rotate(-18 145 278)" />
  <rect x="132" y="240" width="46" height="18" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="3" transform="rotate(-24 155 249)" />
  <rect x="344" y="268" width="46" height="20" rx="4" fill="#dc2626" transform="rotate(18 367 278)" />

  <!-- eyes: big X-stitched button (left), small plain button (right) -->
  <circle cx="210" cy="288" r="28" fill="#cbd5e1" stroke="#475569" stroke-width="5" />
  <path d="M198,276 l24,24 M222,276 l-24,24" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  <circle cx="304" cy="290" r="17" fill="#94a3b8" stroke="#475569" stroke-width="5" />

  <!-- nose + stitched smile -->
  <path d="M244,330 q12,10 24,0" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <path d="M196,346 q60,54 120,0" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" />
  <g stroke="#475569" stroke-width="4" stroke-linecap="round">
    <path d="M210,357 v14" />
    <path d="M236,371 v14" />
    <path d="M276,371 v14" />
    <path d="M302,357 v14" />
  </g>
</svg>
