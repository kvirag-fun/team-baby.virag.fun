name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the callable function's HTTP endpoint directly (diagnostic)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          url="https://europe-central2-$FIREBASE_PROJECT_ID.cloudfunctions.net/notifyOnNewEntry"
          echo "Probing: $url"
          curl -sS -i -X POST "$url" \
            -H "Content-Type: application/json" \
            -d '{"data":{}}' || true
